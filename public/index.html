<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WeClick AI</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --orange:#FF6A00;--orange-light:#FFF3EB;--orange-mid:#FFE0CC;
  --bg:#FAFAFA;--surface:#FFFFFF;--border:#E5E5E5;
  --text:#0F0F0F;--muted:#6B7280;--subtle:#9CA3AF;
  --green:#10B981;--green-bg:#ECFDF5;
  --red:#EF4444;--red-bg:#FEF2F2;
  --blue:#3B82F6;--blue-bg:#EFF6FF;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 16px rgba(0,0,0,.08);
  font-family:'DM Sans',sans-serif;
}
body{background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;display:flex;height:100vh;overflow:hidden}
#sidebar{width:220px;min-width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh}
.sidebar-logo{padding:20px 20px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.logo-mark{width:32px;height:32px;background:var(--orange);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px}
.logo-text{font-size:15px;font-weight:600;letter-spacing:-0.3px}
.logo-sub{font-size:10px;color:var(--muted)}
.sidebar-nav{padding:12px 8px;flex:1;overflow-y:auto}
.nav-section{font-size:10px;font-weight:600;color:var(--subtle);letter-spacing:.8px;text-transform:uppercase;padding:8px 12px 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:6px;cursor:pointer;color:var(--muted);font-size:13.5px;font-weight:400;transition:all .12s;margin-bottom:1px;user-select:none}
.nav-item:hover{background:#F5F5F5;color:var(--text)}
.nav-item.active{background:var(--orange-light);color:var(--orange);font-weight:500}
.nav-item svg{width:16px;height:16px;flex-shrink:0}
.sidebar-footer{padding:12px 16px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
.avatar-sm{width:28px;height:28px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600;flex-shrink:0}
#main{flex:1;overflow:hidden;display:flex;flex-direction:column}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 28px;height:52px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.topbar-title{font-size:15px;font-weight:600;letter-spacing:-0.2px}
.topbar-actions{display:flex;gap:8px;align-items:center}
.page-content{flex:1;overflow-y:auto;padding:24px 28px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px;margin-bottom:24px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;transition:box-shadow .15s;cursor:pointer}
.stat-card:hover{box-shadow:var(--shadow-md)}
.stat-card.accent{border-left:3px solid var(--orange)}
.stat-card.green-accent{border-left:3px solid var(--green)}
.stat-card.blue-accent{border-left:3px solid var(--blue)}
.stat-label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.stat-value{font-size:21px;font-weight:600;letter-spacing:-0.5px}
.stat-sub{font-size:11px;color:var(--muted);margin-top:4px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);transition:all .12s;white-space:nowrap;font-family:inherit}
.btn:hover{background:#F5F5F5}
.btn-primary{background:var(--orange);color:#fff;border-color:var(--orange)}
.btn-primary:hover{background:#e55f00}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-danger{background:var(--red-bg);color:var(--red);border-color:#fecaca}
.btn-ghost{border:none;background:transparent;color:var(--muted);padding:4px 8px}
.btn-ghost:hover{background:#F5F5F5;color:var(--text)}
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:20px}
.table-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}
.table-title{font-size:14px;font-weight:600}
table{width:100%;border-collapse:collapse}
thead th{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding:10px 18px;text-align:left;border-bottom:1px solid var(--border);background:#FAFAFA;white-space:nowrap}
tbody td{padding:11px 18px;border-bottom:1px solid #F5F5F5;font-size:13.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#FAFAFA}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500;white-space:nowrap}
.badge-green{background:var(--green-bg);color:#059669}
.badge-red{background:var(--red-bg);color:#DC2626}
.badge-blue{background:var(--blue-bg);color:var(--blue)}
.badge-orange{background:var(--orange-light);color:var(--orange)}
.badge-gray{background:#F3F4F6;color:var(--muted)}
.badge-purple{background:#F5F3FF;color:#7C3AED}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:20px}
.chart-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.chart-title{font-size:14px;font-weight:600}
.toggle-group{display:flex;background:#F3F4F6;border-radius:6px;padding:2px}
.toggle-btn{padding:4px 12px;border-radius:4px;font-size:12px;cursor:pointer;color:var(--muted);transition:all .12s;font-weight:500}
.toggle-btn.active{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:20px}
.client-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;flex-shrink:0}
.name-cell{display:flex;align-items:center;gap:10px}
.activity-list{list-style:none}
.activity-item{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid #F5F5F5}
.activity-item:last-child{border-bottom:none}
.activity-dot{width:7px;height:7px;border-radius:50%;background:var(--orange);margin-top:5px;flex-shrink:0}
.activity-text{font-size:13px}
.activity-time{font-size:11px;color:var(--subtle);margin-top:1px}
.insight-card{background:linear-gradient(135deg,#FFFBF7,#FFF3EB);border:1px solid var(--orange-mid);border-radius:10px;padding:16px}
.insight-title{font-size:11px;font-weight:700;color:var(--orange);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.insight-text{font-size:12.5px;color:var(--text);line-height:1.55}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:flex;align-items:center;justify-content:center;animation:fadeIn .15s}
.modal{background:var(--surface);border-radius:14px;padding:24px;width:460px;max-width:95vw;box-shadow:0 24px 60px rgba(0,0,0,.18);animation:slideUp .18s ease}
@keyframes slideUp{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.modal-title{font-size:16px;font-weight:600;margin-bottom:20px}
.form-group{margin-bottom:14px}
.form-label{font-size:12px;font-weight:500;color:var(--muted);margin-bottom:5px;display:block}
.form-input{width:100%;padding:8px 11px;border:1px solid var(--border);border-radius:6px;font-size:13.5px;background:var(--surface);color:var(--text);outline:none;font-family:inherit;transition:border-color .12s}
.form-input:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,106,0,.1)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:22px}
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:24px}
.tab{padding:10px 20px;font-size:13.5px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .12s}
.tab.active{color:var(--orange);border-bottom-color:var(--orange)}
.tab:hover:not(.active){color:var(--text)}
.back-btn{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;cursor:pointer;margin-bottom:18px;transition:color .12s}
.back-btn:hover{color:var(--text)}
.client-hero-av{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#fff;position:relative;cursor:pointer;transition:transform .15s,box-shadow .15s;flex-shrink:0}
.client-hero-av:hover{transform:scale(1.04);box-shadow:0 4px 12px rgba(255,106,0,.25)}
.client-hero-av .av-cam{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.15);pointer-events:none}
.file-item{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid #F5F5F5;transition:background .1s}
.file-item:hover{background:#FAFAFA}
.file-item:last-child{border-bottom:none}
.file-icon{width:32px;height:32px;border-radius:6px;background:#F3F4F6;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.file-info{flex:1;min-width:0}
.file-name{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-meta{font-size:11px;color:var(--subtle);margin-top:2px}
.upload-zone{border:2px dashed var(--border);border-radius:8px;padding:28px;text-align:center;cursor:pointer;transition:all .15s;margin-bottom:14px}
.upload-zone:hover{border-color:var(--orange);background:var(--orange-light)}
.progress-wrap{display:flex;align-items:center;gap:8px}
.progress-bar-bg{flex:1;height:4px;background:#F3F4F6;border-radius:4px}
.progress-bar{height:100%;border-radius:4px}
.empty-state{padding:48px 20px;text-align:center;color:var(--muted)}
.empty-icon{font-size:32px;margin-bottom:12px}
.empty-text{font-size:13.5px}
.toast{position:fixed;bottom:24px;right:24px;background:#0F0F0F;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;font-weight:500;z-index:200;animation:slideUp .2s ease;display:flex;align-items:center;gap:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.spinning{animation:spin .7s linear infinite}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.page{animation:fadeIn .18s ease}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#E5E5E5;border-radius:4px}
.search-input{padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:12.5px;color:var(--text);outline:none;font-family:inherit;width:200px;transition:border-color .12s}
.search-input:focus{border-color:var(--orange)}
.loading{padding:48px;text-align:center;color:var(--muted);font-size:13px}
.section-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border)}
.chart-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.select-input{padding:6px 28px 6px 10px;border:1px solid var(--border);border-radius:6px;font-size:12.5px;color:var(--text);background:var(--surface) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M2 4l3 3 3-3' stroke='%236B7280' stroke-width='1.5' fill='none'/></svg>") no-repeat right 8px center;outline:none;font-family:inherit;cursor:pointer;appearance:none}
.select-input:focus{border-color:var(--orange)}
.area-chart{position:relative;width:100%;height:240px}
.area-chart svg{width:100%;height:100%;overflow:visible;display:block}
.chart-tooltip{position:absolute;background:#0F0F0F;color:#fff;padding:8px 10px;border-radius:6px;font-size:12px;pointer-events:none;opacity:0;transform:translate(-50%,-110%);transition:opacity .12s;white-space:nowrap;z-index:10}
.chart-tooltip.show{opacity:1}
.chart-tooltip .tt-label{color:#9CA3AF;font-size:10px;margin-bottom:2px;text-transform:uppercase;letter-spacing:.4px}
.chart-tooltip .tt-row{display:flex;align-items:center;gap:6px;font-weight:500}
.chart-tooltip .tt-dot{width:7px;height:7px;border-radius:50%}
@keyframes drawLine{from{stroke-dashoffset:1500}to{stroke-dashoffset:0}}
.chart-line{stroke-dasharray:1500;stroke-dashoffset:1500;animation:drawLine .9s ease-out forwards}
@keyframes fadeArea{from{opacity:0}to{opacity:1}}
.chart-area-fill{animation:fadeArea .8s ease-out forwards .2s;opacity:0}
@keyframes popDot{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.chart-dot{transform-origin:center;transform-box:fill-box;animation:popDot .35s ease-out forwards;opacity:0;cursor:pointer}
.rev-filter-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:20px}
.rev-pills{display:flex;gap:6px;padding:14px 20px 14px;flex-wrap:wrap;border-bottom:1px solid var(--border);align-items:center}
.rev-pill{display:inline-flex;align-items:center;padding:5px 14px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border);color:var(--muted);transition:all .12s;user-select:none;white-space:nowrap}
.rev-pill.active{background:var(--orange);color:#fff;border-color:var(--orange)}
.rev-pill:hover:not(.active){border-color:var(--orange);color:var(--orange)}
.rev-display{display:flex;align-items:center;justify-content:space-between;padding:20px 24px}
.rev-big-num{font-size:34px;font-weight:700;letter-spacing:-1.5px;color:var(--text)}
.rev-sub{font-size:12px;color:var(--muted);margin-top:3px}
.budget-bar-wrap{margin:0 20px 16px;background:#F3F4F6;border-radius:100px;height:8px;overflow:hidden}
.budget-bar-fill{height:100%;border-radius:100px;transition:width .4s}
.alert-bar{display:flex;align-items:flex-start;gap:10px;padding:11px 16px;border-radius:8px;font-size:13px;margin-bottom:10px;border:1px solid transparent}
.alert-bar.warning{background:#FFFBEB;border-color:#FDE68A;color:#92400E}
.alert-bar.critical{background:#FEF2F2;border-color:#FECACA;color:#991B1B}
.alert-bar .al-icon{font-size:15px;flex-shrink:0;margin-top:1px}
.alerts-section{margin-bottom:18px}
.meta-section{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:20px}
.meta-metrics{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;padding:16px 20px}
.meta-metric{background:#FAFAFA;border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.meta-metric-label{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.meta-metric-value{font-size:18px;font-weight:600;color:var(--text)}
.meta-metric-value.orange{color:var(--orange)}
.meta-metric-value.green{color:var(--green)}
.meta-badge{display:inline-flex;align-items:center;gap:4px;background:#EBF5FF;color:#1877F2;border:1px solid #BFDBFE;border-radius:20px;font-size:10px;font-weight:600;padding:1px 7px;margin-left:6px;vertical-align:middle}
.low-budget-banner{display:flex;align-items:flex-start;gap:12px;padding:14px 20px;border-bottom:1px solid var(--border)}
.cd-header{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:20px}
.cd-header-top{padding:22px 24px;display:flex;align-items:flex-start;gap:18px}
.cd-av{width:64px;height:64px;border-radius:50%;flex-shrink:0;position:relative;overflow:hidden;cursor:pointer;transition:transform .15s}
.cd-av:hover{transform:scale(1.04)}
.cd-av-inner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#fff}
.cd-av-cam{position:absolute;right:-1px;bottom:-1px;width:20px;height:20px;border-radius:50%;background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;border:2px solid #fff;pointer-events:none}
.cd-info{flex:1;min-width:0}
.cd-name{font-size:20px;font-weight:700;letter-spacing:-0.5px;margin-bottom:5px}
.cd-company{font-size:13.5px;color:var(--muted);margin-bottom:2px}
.cd-email{font-size:12px;color:var(--muted)}
.cd-actions{display:flex;gap:8px;flex-shrink:0}
.cd-stats{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--border)}
.cd-stat{padding:16px 20px;border-right:1px solid var(--border)}
.cd-stat:last-child{border-right:none}
.cd-stat-lbl{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.cd-stat-val{font-size:20px;font-weight:700;letter-spacing:-0.5px}
.cd-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:16px}
.cd-card-head{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}
.cd-card-title{font-size:13.5px;font-weight:600}
.calendar{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:20px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-title{font-size:15px;font-weight:600}
.cal-nav{display:flex;gap:6px;align-items:center}
.cal-nav-btn{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:all .12s}
.cal-nav-btn:hover{background:#F5F5F5;color:var(--text)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-day-name{font-size:10px;font-weight:600;color:var(--subtle);text-transform:uppercase;letter-spacing:.5px;text-align:center;padding:6px 0}
.cal-day{aspect-ratio:1;border:1px solid var(--border);border-radius:6px;padding:6px;cursor:pointer;display:flex;flex-direction:column;transition:all .12s;background:var(--surface);min-height:64px}
.cal-day:hover{border-color:var(--orange);background:var(--orange-light)}
.cal-day.empty{border:none;cursor:default;background:transparent}
.cal-day.today{border-color:var(--orange);box-shadow:0 0 0 1px var(--orange)}
.cal-day-num{font-size:12px;font-weight:500;color:var(--text)}
.cal-day.today .cal-day-num{color:var(--orange);font-weight:700}
.cal-day-tasks{display:flex;flex-wrap:wrap;gap:3px;margin-top:auto}
.cal-task-dot{width:7px;height:7px;border-radius:50%}
.quote-table{width:100%;border-collapse:collapse;margin-bottom:14px}
.quote-table th{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;padding:8px;text-align:left;border-bottom:1px solid var(--border);background:#FAFAFA}
.quote-table td{padding:8px;border-bottom:1px solid #F5F5F5;font-size:13px;vertical-align:middle}
.quote-table input{width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:5px;font-size:13px;font-family:inherit;outline:none}
.quote-table input:focus{border-color:var(--orange)}
.quote-totals{display:flex;flex-direction:column;gap:6px;padding:14px 16px;background:#FAFAFA;border-radius:8px;margin-top:8px}
.quote-totals-row{display:flex;justify-content:space-between;font-size:13px}
.quote-totals-row.grand{font-size:16px;font-weight:700;color:var(--orange);border-top:1px solid var(--border);padding-top:8px;margin-top:4px}
.quote-preview{background:#fff;border:1px solid var(--border);border-radius:10px;padding:32px;font-family:'DM Sans',sans-serif}
.quote-preview-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;padding-bottom:18px;border-bottom:2px solid var(--orange)}
.quote-preview-brand{display:flex;align-items:center;gap:10px}
.quote-preview-brand .logo-mark{width:40px;height:40px;font-size:14px}
.quote-preview-meta{text-align:right;font-size:12px;color:var(--muted)}
.quote-preview-meta strong{color:var(--text);font-size:13px;display:block;margin-bottom:2px}
.quote-preview-to{margin-bottom:18px;font-size:13px}
.quote-preview-to strong{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:3px}
.quote-preview table{width:100%;border-collapse:collapse;margin-bottom:18px}
.quote-preview thead th{background:#FAFAFA;text-align:left;padding:10px;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);border-bottom:2px solid var(--border)}
.quote-preview tbody td{padding:10px;border-bottom:1px solid #F0F0F0;font-size:13px}
.quote-preview-totals{margin-left:auto;width:280px}
.quote-preview-totals .row{display:flex;justify-content:space-between;padding:6px 0;font-size:13px}
.quote-preview-totals .row.grand{border-top:2px solid var(--orange);padding-top:10px;margin-top:6px;font-size:15px;font-weight:700;color:var(--orange)}
.quote-preview-foot{margin-top:24px;padding-top:14px;border-top:1px dashed var(--border);font-size:11.5px;color:var(--muted);line-height:1.6}
.modal-lg{width:680px;max-width:96vw}
.modal-xl{width:820px;max-width:96vw;max-height:90vh;overflow-y:auto}
.modal-2xl{width:960px;max-width:96vw;max-height:90vh;overflow-y:auto}

/* ── AD ANALYTICS ── */
.creative-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;padding:20px}
.creative-card{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--surface);transition:box-shadow .15s}
.creative-card:hover{box-shadow:var(--shadow-md)}
.creative-thumb{height:140px;background:#F3F4F6;display:flex;align-items:center;justify-content:center;font-size:36px;position:relative}
.creative-rank{position:absolute;top:8px;left:8px;background:var(--orange);color:#fff;border-radius:20px;font-size:10px;font-weight:700;padding:2px 7px}
.creative-info{padding:12px}
.creative-name{font-size:13px;font-weight:600;margin-bottom:4px}
.creative-metrics{display:flex;gap:12px;font-size:11px;color:var(--muted)}

/* ── TALLY / SPEND TRACKER ── */
.tally-month-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:20px}
.tally-month-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 18px}
.tally-month-name{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.tally-month-val{font-size:22px;font-weight:700;letter-spacing:-0.5px}
.tally-cats{margin-top:10px;display:flex;flex-direction:column;gap:5px}
.tally-cat-row{display:flex;align-items:center;justify-content:space-between;font-size:12px}
.tally-cat-bar{height:3px;background:var(--orange);border-radius:3px;margin-top:2px}
.spend-summary-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:20px}

/* ── CLIENT PAUSE ── */
.pause-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.pause-badge.active{background:#ECFDF5;color:#059669}
.pause-badge.paused{background:#FEF9C3;color:#854D0E}
.pause-badge.stopped{background:#FEF2F2;color:#991B1B}

/* ── REMINDER ── */
.reminder-row{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid #F5F5F5;font-size:13px}
.reminder-row:last-child{border-bottom:none}

/* ── SETTINGS TABS ── */
.settings-nav{display:flex;flex-direction:column;gap:2px;width:180px;flex-shrink:0}
.settings-nav-item{padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--muted);transition:all .12s}
.settings-nav-item.active{background:var(--orange-light);color:var(--orange);font-weight:500}
.settings-nav-item:hover:not(.active){background:#F5F5F5;color:var(--text)}
.settings-body{flex:1;min-width:0}
.settings-section-title{font-size:16px;font-weight:600;margin-bottom:4px}
.settings-section-sub{font-size:13px;color:var(--muted);margin-bottom:20px}

@media print{
  body *{visibility:hidden!important}
  #print-area, #print-area *{visibility:visible!important}
  #print-area{position:absolute;left:0;top:0;width:100%;padding:20px;background:#fff}
  .no-print{display:none!important}
}
</style>

<div id="main">
  <div class="topbar">
    <div class="topbar-title" id="topbar-title">Dashboard</div>
    <div class="topbar-actions" id="topbar-actions"></div>
  </div>
  <div class="page-content" id="page-content">
    <div class="loading">Loading...</div>
  </div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
const API = '';
let appState = {
  page:'dashboard', chartPeriod:'30', chartClientId:'all',
  financeTab:'company', selectedClientId:null, calendarMonth:null,
  clients:[], campaigns:[], automations:[], collaborations:[], users:[],
  syncing:false, quoteItems:[], settingsTab:'company',
  adAnalyticsTab:'meta', adAnalyticsClientId:'all'
};

// ── UTILS ──────────────────────────────────────────────────────
function fmt(n){
  n=Math.round(parseFloat(n)||0);
  if(isNaN(n)||!isFinite(n))return '₹0';
  if(n<0)return '-'+fmt(-n);
  // Use Indian number format
  return '₹'+n.toLocaleString('en-IN',{maximumFractionDigits:0});
}
function ini(name){return (name||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();}
function avatarHtml(c, opts){
  opts=opts||{};
  const cls=opts.cls||'client-avatar';
  const size=opts.size||'';
  const inline=size?`width:${size}px;height:${size}px;font-size:${Math.max(9,Math.round(size*0.36))}px;`:'';
  const initials=ini(c.name);
  if(c.avatar_url){
    return `<div class="${cls}" style="background:${c.color};${inline}position:relative;overflow:hidden">
      <span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">${initials}</span>
      <img src="${c.avatar_url}" alt="" onerror="this.remove()" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%"/>
    </div>`;
  }
  return `<div class="${cls}" style="background:${c.color};${inline}">${initials}</div>`;
}
function relTime(d){const days=Math.floor((Date.now()-new Date(d).getTime())/86400000);return days===0?'Today':days===1?'Yesterday':days+'d ago';}
function toast(msg,type='success'){
  const el=document.getElementById('toast-root');
  const div=document.createElement('div');
  div.className='toast';
  div.innerHTML=`<span>${type==='success'?'✓':'✕'}</span>${msg}`;
  el.appendChild(div);
  setTimeout(()=>div.remove(),3000);
}
async function api(path,opts={}){
  try{
    const res=await fetch(API+path,{headers:{'Content-Type':'application/json'},...opts});
    const ct=res.headers.get('content-type')||'';
    if(!ct.includes('application/json')){await res.text();throw new Error('API '+path+' returned non-JSON ('+res.status+')')}
    const data=await res.json();
    if(!res.ok) throw new Error(data.error||'Request failed');
    return data;
  }catch(e){toast(e.message,'error');throw e;}
}
function timeAgo(ts){
  if(!ts) return '';
  const now=new Date(),d=new Date(ts);
  const diff=Math.floor((now-d)/1000);
  if(diff<60) return 'Just now';
  if(diff<3600) return Math.floor(diff/60)+'m ago';
  if(diff<86400) return Math.floor(diff/3600)+'h ago';
  if(diff<172800) return 'Yesterday';
  if(diff<604800) return Math.floor(diff/86400)+'d ago';
  return d.toLocaleDateString('en-IN',{day:'numeric',month:'short'});
}
function activityIcon(type){
  const icons={campaign:'📣',client:'👤',revenue:'💰',meta:'📊',automation:'🤖',quotation:'📄',reminder:'🔔',expense:'💸',finance:'💳',creative:'🎨',google:'🔍',def:'⚡'};
  return icons[type]||icons.def;
}
function activityColor(type){
  const colors={campaign:'#FF6A00',client:'#3B82F6',revenue:'#10B981',meta:'#8B5CF6',automation:'#F59E0B',quotation:'#EC4899',reminder:'#EF4444',expense:'#F97316',finance:'#6366F1',creative:'#06B6D4'};
  return colors[type]||'#FF6A00';
}
function platformColor(p){
  return {Instagram:'#E1306C',Meta:'#1877F2',LinkedIn:'#0A66C2',YouTube:'#FF0000',Google:'#4285F4'}[p]||'#888';
}
function clientStatusBadgeClass(status){
  return {Active:'badge-green',Paused:'badge-orange',Stopped:'badge-red'}[status]||'badge-gray';
}

// ── SIDEBAR NAV ────────────────────────────────────────────────
document.querySelectorAll('.nav-item[data-page]').forEach(el=>{
  el.addEventListener('click',()=>navigate(el.dataset.page));
});
function setActiveNav(page){
  document.querySelectorAll('.nav-item[data-page]').forEach(el=>{
    el.classList.toggle('active',el.dataset.page===page);
  });
}

// ── NAVIGATION ─────────────────────────────────────────────────
async function navigate(page,id){
  appState.page=page;
  if(id!==undefined) appState.selectedClientId=id;
  const navMap={clientDetail:'clients'};
  setActiveNav(navMap[page]||page);
  const titles={dashboard:'Dashboard',clients:'Clients',clientDetail:'Client Detail',campaigns:'Campaigns',automations:'Automations',collaborations:'Collaborations',revenue:'Revenue · Finance Hub',tally:'Tally / Daily Spends',reminders:'Payment Reminders',meetings:'Client Meetings',adanalytics:'Ad Analytics',settings:'Settings'};
  document.getElementById('topbar-title').textContent=titles[page]||page;
  renderTopbarActions();
  const content=document.getElementById('page-content');
  content.innerHTML='<div class="loading">Loading...</div>';
  await renderPage();
}
function renderTopbarActions(){
  const el=document.getElementById('topbar-actions');
  const p=appState.page;
  if(p==='dashboard') el.innerHTML=`<button class="btn btn-sm" onclick="syncMeta()"><svg id="sync-icon" width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 8A6 6 0 112 8"/><path d="M14 2v6h-6"/></svg> Sync Meta</button>`;
  else if(p==='clients') el.innerHTML=`<button class="btn btn-primary btn-sm" onclick="openAddClient()">+ Add Client</button>`;
  else if(p==='campaigns') el.innerHTML=`<button class="btn btn-primary btn-sm" onclick="openAddCampaign()">+ Add Campaign</button>`;
  else if(p==='automations') el.innerHTML=`<button class="btn btn-primary btn-sm" onclick="openAddAutomation()">+ Add Automation</button>`;
  else if(p==='collaborations') el.innerHTML=`<button class="btn btn-primary btn-sm" onclick="openAddCollab()">+ Add Partner</button>`;
  else if(p==='revenue') el.innerHTML=`<button class="btn btn-primary btn-sm" onclick="openAddRevenue()">+ Manual Revenue</button>`;
  else if(p==='tally') el.innerHTML=`<button class="btn btn-primary btn-sm" onclick="openAddSpend()">+ Add Spend</button>`;
  else if(p==='meetings') el.innerHTML=`<button class="btn btn-primary btn-sm" onclick="openAddMeeting()">+ Schedule Meeting</button>`;
  else if(p==='reminders') el.innerHTML=`<button class="btn btn-primary btn-sm" onclick="openAddReminder()">+ Add Reminder</button>`;
  else el.innerHTML='';
}

// ── PAGE RENDER ────────────────────────────────────────────────
async function renderPage(){
  const el=document.getElementById('page-content');
  el.innerHTML='';
  const div=document.createElement('div');
  div.className='page';
  switch(appState.page){
    case 'dashboard': div.innerHTML=await buildDashboard();break;
    case 'clients': div.innerHTML=await buildClients();break;
    case 'clientDetail': div.innerHTML=await buildClientDetail();break;
    case 'campaigns': div.innerHTML=await buildCampaigns();break;
    case 'automations': div.innerHTML=await buildAutomations();break;
    case 'collaborations': div.innerHTML=await buildCollaborations();break;
    case 'revenue': div.innerHTML=await buildRevenue();break;
    case 'tally': div.innerHTML=await buildTally();break;
    case 'meetings': div.innerHTML=await buildMeetings();break;
    case 'reminders': div.innerHTML=await buildReminders();break;
    case 'adanalytics': div.innerHTML=await buildAdAnalytics();break;
    case 'settings': div.innerHTML=await buildSettings();break;
    default: div.innerHTML='<p>Page not found</p>';
  }
  el.appendChild(div);
  drawChart();
  if(appState.page==='dashboard') initDashboardCharts();
}

// ── DASHBOARD ──────────────────────────────────────────────────
async function buildDashboard(){
  const [stats,clients,alerts,breakdown] = await Promise.all([
    api('/api/dashboard').catch(()=>({})),
    api('/api/clients').catch(()=>[]),
    api('/api/meta/alerts').catch(()=>[]),
    api('/api/revenue/breakdown').catch(()=>({}))
  ]);
  appState.clients=clients||[];
  const s=stats||{};
  const safeStats={totalRevenue:s.totalRevenue||0,totalSpend:s.totalSpend||0,profit:s.profit||0,activeClients:s.activeClients||0,totalClients:s.totalClients||0,activeAutomations:s.activeAutomations||0,automationRevenue:s.automationRevenue||0,collaborationRevenue:s.collaborationRevenue||0,thisMonth:s.thisMonth||0,projected:s.projected||0,recentActivity:s.recentActivity||[]};
  Object.assign(stats||{},safeStats);
  if(!stats) stats=safeStats;
  const alertsHtml=alerts.length?`<div class="alerts-section">
    <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px">⚡ Meta Ads Alerts (${alerts.length})</div>
    ${alerts.map(a=>`<div class="alert-bar ${a.type}">
      <span class="al-icon">${a.type==='critical'?'🚨':'⚠️'}</span>
      <div><span style="font-weight:600;margin-right:4px">${a.client}</span><span style="opacity:.7">${a.company} · </span>${a.msg}</div>
      <button class="btn btn-ghost btn-sm" style="margin-left:auto;opacity:.7" onclick="navigate('clientDetail',${a.client_id})">View →</button>
    </div>`).join('')}
  </div>`:'';

  const bd=breakdown||{};
  appState.revBreakdown=bd;
  if(!appState.revPeriod) appState.revPeriod='today';
  const PERIODS=['today','yesterday','7d','30d','90d'];
  const PERIOD_LABELS={today:'Today',yesterday:'Yesterday','7d':'7 Days','30d':'30 Days','90d':'90 Days'};
  const periodValue=p=>({today:bd.today,yesterday:bd.yesterday,'7d':bd.last7,'30d':bd.last30,'90d':bd.last90}[p]||0);
  const curVal=appState.revPeriod==='date'?(appState.revCustomVal||0):periodValue(appState.revPeriod);
  const cmpVal=appState.revPeriod==='today'?bd.yesterday:appState.revPeriod==='yesterday'?bd.dayBefore:null;
  const diff=cmpVal!=null?curVal-cmpVal:null;
  const pctStr=diff!=null&&cmpVal>0?(Math.abs((diff/cmpVal)*100)).toFixed(1)+'%':null;
  const dateStr=appState.revPeriod==='date'&&appState.revCustomDate?' · '+appState.revCustomDate:(bd.dates&&appState.revPeriod==='today')?' · '+bd.dates.today:(bd.dates&&appState.revPeriod==='yesterday')?' · '+bd.dates.yesterday:'';
  const cmpLbl=appState.revPeriod==='today'?'vs yesterday':appState.revPeriod==='yesterday'?'vs day before':null;

  const revenueBreakdownHtml=`
  <div class="rev-filter-card">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 20px 0">
      <div class="table-title">Revenue</div>
      <button class="btn btn-ghost btn-sm" onclick="navigate('revenue')">View All →</button>
    </div>
    <div class="rev-pills" id="rev-pills">
      ${PERIODS.map(p=>`<span class="rev-pill${appState.revPeriod===p?' active':''}" onclick="setRevPeriod('${p}')">${PERIOD_LABELS[p]}</span>`).join('')}
      <span class="rev-pill${appState.revPeriod==='date'?' active':''}" onclick="setRevPeriod('date')">📅 Pick Date</span>
    </div>
    <div id="rev-date-row" style="display:${appState.revPeriod==='date'?'block':'none'};padding:12px 20px 0">
      <input type="date" class="form-input" id="rev-custom-date" value="${appState.revCustomDate||new Date().toISOString().split('T')[0]}" style="max-width:180px;height:34px;font-size:13px" onchange="loadRevCustomDate(this.value)">
    </div>
    <div class="rev-display" id="rev-display">
      <div>
        <div class="rev-big-num">${fmt(curVal)}</div>
        <div class="rev-sub">${appState.revPeriod==='date'?'Custom Date'+dateStr:PERIOD_LABELS[appState.revPeriod]+dateStr}</div>
      </div>
      ${diff!=null?`<div style="text-align:right">
        <div style="font-size:22px;font-weight:700;color:${diff>=0?'var(--green)':'var(--red)'}">${diff>=0?'↑':'↓'} ${pctStr||'—'}</div>
        <div style="font-size:11px;color:var(--muted)">${cmpLbl}</div>
      </div>`:'<div style="color:var(--subtle);font-size:12px">No comparison</div>'}
    </div>
  </div>`;

  return `
  ${alertsHtml}
  ${revenueBreakdownHtml}
  <div class="stats-grid">
    <div class="stat-card accent" onclick="navigate('revenue')"><div class="stat-label">Total Revenue</div><div class="stat-value">${fmt(safeStats.totalRevenue)}</div><div class="stat-sub" style="color:var(--green)">↑ 18.4% vs last month</div></div>
    <div class="stat-card" onclick="navigate('adanalytics')"><div class="stat-label">Total Ad Spend</div><div class="stat-value">${fmt(safeStats.totalSpend)}</div><div class="stat-sub" style="color:var(--muted)">↑ 9.2% vs last</div></div>
    <div class="stat-card green-accent" onclick="navigate('revenue')"><div class="stat-label">Profit</div><div class="stat-value" style="color:var(--green)">${fmt(safeStats.profit)}</div><div class="stat-sub" style="color:var(--green)">↑ 24.1% margin</div></div>
    <div class="stat-card blue-accent" onclick="navigate('clients')"><div class="stat-label">Active Clients</div><div class="stat-value">${safeStats.activeClients}</div><div class="stat-sub">${safeStats.totalClients} total</div></div>
    <div class="stat-card" onclick="navigate('automations')"><div class="stat-label">Active Automations</div><div class="stat-value">${safeStats.activeAutomations}</div></div>

// ── CHART UTILITIES ────────────────────────────────────────────
function seriesFor(clientId,period,baseRev,baseSpend){
  const n=period==='30'?30:12;
  let seed=(parseInt(clientId,10)||7)*13+(period==='30'?1:2);
  const rand=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};
  const rev=[],sp=[];
  for(let i=0;i<n;i++){
    const t=i/(n-1);
    const wave=0.65+0.45*Math.sin(t*Math.PI*1.6)+(rand()-0.5)*0.25;
    const trend=0.8+t*0.45;
    rev.push(Math.max(0,Math.round(baseRev*wave*trend)));
    sp.push(Math.max(0,Math.round(baseSpend*(0.7+(rand()-0.4)*0.5)*(0.85+t*0.3))));
  }
  return{rev,sp};
}
function chartLabels(period){
  if(period==='30'){
    const out=[];const today=new Date();
    for(let i=29;i>=0;i--){const d=new Date(today);d.setDate(d.getDate()-i);out.push(d.getDate());}
    return out;
  }
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const out=[];const today=new Date();
  for(let i=11;i>=0;i--){const d=new Date(today.getFullYear(),today.getMonth()-i,1);out.push(months[d.getMonth()]);}
  return out;
}
function smoothPath(points){
  if(points.length<2) return '';
  let d=`M ${points[0].x} ${points[0].y}`;
  for(let i=0;i<points.length-1;i++){
    const p0=points[i-1]||points[i],p1=points[i],p2=points[i+1],p3=points[i+2]||p2;
    const cp1x=p1.x+(p2.x-p0.x)/6,cp1y=p1.y+(p2.y-p0.y)/6;
    const cp2x=p2.x-(p3.x-p1.x)/6,cp2y=p2.y-(p3.y-p1.y)/6;
    d+=` C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${p2.x} ${p2.y}`;
  }
  return d;
}
function drawChart(){
  const area=document.getElementById('chart-area');
  if(!area) return;
  const period=appState.chartPeriod;
  const labels=chartLabels(period);
  let rev,sp;
  if(appState.chartClientId==='all'){
    const totalRev=appState.clients.reduce((s,c)=>s+(c.revenue||0),0);
    const totalSp=appState.clients.reduce((s,c)=>s+(c.spend||0),0);
    const baseRev=(totalRev/labels.length)||250000;
    const baseSp=(totalSp/labels.length)||80000;
    ({rev,sp}=seriesFor('all',period,baseRev,baseSp));
  } else {
    const c=appState.clients.find(x=>String(x.id)===String(appState.chartClientId));
    const baseRev=((c?.revenue)||100000)/labels.length;
    const baseSp=((c?.spend)||30000)/labels.length;
    ({rev,sp}=seriesFor(c?.id||1,period,baseRev,baseSp));
  }
  const W=area.clientWidth||820,H=240;
  const padL=44,padR=16,padT=14,padB=28;
  const innerW=W-padL-padR,innerH=H-padT-padB;
  const max=Math.max(...rev,...sp,1);
  const niceMax=Math.ceil(max/100000)*100000||max;
  const x=i=>padL+(labels.length===1?innerW/2:i*innerW/(labels.length-1));
  const y=v=>padT+innerH-(v/niceMax)*innerH;
  const revPts=rev.map((v,i)=>({x:x(i),y:y(v),v}));
  const spPts=sp.map((v,i)=>({x:x(i),y:y(v),v}));
  const revPath=smoothPath(revPts);
  const spPath=smoothPath(spPts);
  const revArea=`${revPath} L ${revPts[revPts.length-1].x} ${padT+innerH} L ${revPts[0].x} ${padT+innerH} Z`;
  const spArea=`${spPath} L ${spPts[spPts.length-1].x} ${padT+innerH} L ${spPts[0].x} ${padT+innerH} Z`;
  const gridLines=[],gridLabels=[];
  for(let i=0;i<=4;i++){
    const yy=padT+innerH*i/4;
    const val=Math.round(niceMax*(1-i/4));
    const valLabel=val>=10000000?'₹'+(val/10000000).toFixed(1)+'Cr':val>=100000?'₹'+(val/100000).toFixed(1)+'L':val>=1000?'₹'+(val/1000).toFixed(0)+'k':val===0?'0':'₹'+val;
    gridLines.push(`<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="#F0F0F0" stroke-width="1"/>`);
    gridLabels.push(`<text x="${padL-8}" y="${yy+4}" text-anchor="end" font-size="10" fill="#9CA3AF" font-family="DM Sans">${val>=10000000?(val/10000000).toFixed(1)+'Cr':val>=100000?(val/100000).toFixed(1)+'L':val>=1000?(val/1000).toFixed(0)+'k':val===0?'0':val}</text>`);
  }
  const step=Math.max(1,Math.ceil(labels.length/7));
  const xLabels=labels.map((l,i)=>(i%step===0||i===labels.length-1)?`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="#9CA3AF" font-family="DM Sans">${l}</text>`:'').join('');
  area.innerHTML=`
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <defs>
        <linearGradient id="revGrad" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stop-color="#FF6A00" stop-opacity="0.32"/>
          <stop offset="100%" stop-color="#FF6A00" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="spGrad" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stop-color="#9CA3AF" stop-opacity="0.18"/>
          <stop offset="100%" stop-color="#9CA3AF" stop-opacity="0"/>
        </linearGradient>
      </defs>
      ${gridLines.join('')}${gridLabels.join('')}${xLabels}
      <path class="chart-area-fill" d="${spArea}" fill="url(#spGrad)"/>
      <path class="chart-line" d="${spPath}" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:.05s"/>
      <path class="chart-area-fill" d="${revArea}" fill="url(#revGrad)" style="animation-delay:.1s"/>
      <path class="chart-line" d="${revPath}" fill="none" stroke="#FF6A00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      ${spPts.map((p,i)=>`<circle class="chart-dot" cx="${p.x}" cy="${p.y}" r="3.5" fill="#fff" stroke="#9CA3AF" stroke-width="2" data-i="${i}" data-kind="sp" style="animation-delay:${0.5+i*0.02}s"/>`).join('')}
      ${revPts.map((p,i)=>`<circle class="chart-dot" cx="${p.x}" cy="${p.y}" r="4" fill="#fff" stroke="#FF6A00" stroke-width="2.5" data-i="${i}" data-kind="rev" style="animation-delay:${0.6+i*0.02}s"/>`).join('')}
    </svg>`;
  const tt=document.getElementById('chart-tooltip');
  area.querySelectorAll('.chart-dot').forEach(dot=>{
    dot.addEventListener('mouseenter',()=>{
      const i=parseInt(dot.dataset.i,10);
      const cx=parseFloat(dot.getAttribute('cx'));
      const cy=parseFloat(dot.getAttribute('cy'));
      const rect=area.getBoundingClientRect();
      const scaleX=rect.width/W,scaleY=rect.height/H;
      tt.style.left=(cx*scaleX)+'px';
      tt.style.top=(cy*scaleY)+'px';
      tt.innerHTML=`<div class="tt-label">${labels[i]}</div>
        <div class="tt-row"><span class="tt-dot" style="background:#FF6A00"></span>Revenue ${fmt(rev[i])}</div>
        <div class="tt-row"><span class="tt-dot" style="background:#9CA3AF"></span>Ad Spend ${fmt(sp[i])}</div>`;
      tt.classList.add('show');
    });
    dot.addEventListener('mouseleave',()=>tt.classList.remove('show'));
  });
}
function toggleChart(p){appState.chartPeriod=p;document.querySelectorAll('.toggle-btn').forEach(b=>{b.classList.toggle('active',b.textContent.trim().startsWith(p==='30'?'30':'90'));});drawChart();}

function renderClientPerfChart(clients){
  const canvas=document.getElementById('clientPerfChart');if(!canvas)return;
  if(_perfChart){_perfChart.destroy();_perfChart=null;}
  const labels=clients.map(c=>c.name.split(' ')[0]);
  const fmtTick=v=>v>=10000000?'₹'+(v/10000000).toFixed(1)+'Cr':v>=100000?'₹'+(v/100000).toFixed(1)+'L':v>=1000?'₹'+(v/1000).toFixed(0)+'k':'₹'+v;
  _perfChart=new Chart(canvas,{
    type:'bar',
    data:{labels,datasets:[
      {label:'Revenue',data:clients.map(c=>c.revenue||0),backgroundColor:'#FF6A00',borderRadius:5,maxBarThickness:30},
      {label:'Ad Spend',data:clients.map(c=>c.spend||0),backgroundColor:'#D1D5DB',borderRadius:5,maxBarThickness:30},
      {label:'Profit',data:clients.map(c=>c.profit||0),backgroundColor:'#10B981',borderRadius:5,maxBarThickness:30}
    ]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{backgroundColor:'#fff',borderColor:'#E5E5E5',borderWidth:1,titleColor:'#0F0F0F',bodyColor:'#6B7280',padding:10,callbacks:{label:ctx=>` ${ctx.dataset.label}: ₹${(ctx.raw||0).toLocaleString('en-IN')}`}}},scales:{x:{grid:{display:false},ticks:{font:{family:'DM Sans',size:11},color:'#6B7280'}},y:{grid:{color:'#F3F4F6',drawBorder:false},ticks:{font:{family:'DM Sans',size:10},color:'#9CA3AF',callback:fmtTick}}}}
  });
}
function renderRevDonutChart(clients){
  const canvas=document.getElementById('revenueDonutChart');if(!canvas)return;
  if(_donutChart){_donutChart.destroy();_donutChart=null;}
  const active=clients.filter(c=>(c.revenue||0)>0);
  const total=active.reduce((s,c)=>s+(c.revenue||0),0);
  _donutChart=new Chart(canvas,{type:'doughnut',data:{labels:active.map(c=>c.name),datasets:[{data:active.map(c=>c.revenue||0),backgroundColor:active.map(c=>c.color||'#FF6A00'),borderWidth:2,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,cutout:'62%',plugins:{legend:{display:false},tooltip:{backgroundColor:'#fff',borderColor:'#E5E5E5',borderWidth:1,titleColor:'#0F0F0F',bodyColor:'#6B7280',padding:10,callbacks:{label:ctx=>{const pct=total>0?((ctx.raw/total)*100).toFixed(1):0;return ` ₹${(ctx.raw||0).toLocaleString('en-IN')} · ${pct}%`;}}}}}});
  const leg=document.getElementById('donut-legend');
  if(leg) leg.innerHTML=active.map(c=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:2px 0"><div style="display:flex;align-items:center;gap:7px"><div style="width:8px;height:8px;border-radius:50%;background:${c.color||'#FF6A00'};flex-shrink:0"></div><span style="font-size:11.5px">${c.name}</span></div><div><span style="font-size:12px;font-weight:600">₹${(c.revenue||0).toLocaleString('en-IN',{maximumFractionDigits:0})}</span><span style="font-size:10px;color:var(--muted);margin-left:5px">${total>0?((c.revenue/total)*100).toFixed(1):0}%</span></div></div>`).join('');
}
function renderFunnelChart(funnel){
  const canvas=document.getElementById('funnelChart');if(!canvas)return;
  if(_funnelChart){_funnelChart.destroy();_funnelChart=null;}
  const imp=funnel.impressions||0,clk=funnel.clicks||0,lds=funnel.leads||0,conv=funnel.conversions||Math.round(lds*0.6);
  const values=[imp,clk,lds,conv];
  const stages=['Impressions','Clicks','Leads','Est. Converts'];
  const dropLabel=['',imp>0?((clk/imp)*100).toFixed(2)+'% CTR':'—',clk>0?((lds/clk)*100).toFixed(1)+'% Lead Rate':'—',lds>0?((conv/lds)*100).toFixed(0)+'% Conv.':'—'];
  const fmtVal=v=>v>=1000000?(v/1000000).toFixed(1)+'M':v>=1000?(v/1000).toFixed(1)+'k':''+v;
  _funnelChart=new Chart(canvas,{type:'bar',data:{labels:stages,datasets:[{data:values,backgroundColor:['rgba(255,106,0,0.92)','rgba(255,106,0,0.72)','rgba(255,106,0,0.52)','rgba(255,106,0,0.32)'],borderRadius:6,barPercentage:0.55}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{backgroundColor:'#fff',borderColor:'#E5E5E5',borderWidth:1,titleColor:'#0F0F0F',bodyColor:'#6B7280',padding:10,callbacks:{label:ctx=>{const drop=dropLabel[ctx.dataIndex];return ` ${fmtVal(ctx.raw)}${drop?' · '+drop:''}`;}}}},scales:{x:{grid:{color:'#F3F4F6'},ticks:{font:{family:'DM Sans',size:10},color:'#9CA3AF',callback:v=>v>=1000000?(v/1000000).toFixed(1)+'M':v>=1000?(v/1000).toFixed(0)+'k':''+v}},y:{grid:{display:false},ticks:{font:{family:'DM Sans',size:12},color:'#0F0F0F',callback:(val,idx)=>{const s=stages[idx];const d=dropLabel[idx];return d?`${s}  (${d})`:s;}}}}}});
}

      <div style="font-size:12px;color:${c.status==='Stopped'?'#B91C1C':'#B45309'}">No active campaigns or automations running this month.</div>

  const headerHtml=`
  <div class="cd-header">
    <div style="height:4px;background:${c.color}"></div>
    ${statusBanner}
    <div class="cd-header-top">
      <div class="cd-av" style="background:${c.color}" onclick="document.getElementById('avatar-input').click()" title="Click to change photo">
        <div class="cd-av-inner">${ini(c.name)}</div>
        ${c.avatar_url?`<img src="${c.avatar_url}" onerror="this.remove()" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"/>`:''}

        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px">

        </div>

        <button class="btn btn-sm" onclick="openSendReport(${c.id})">Send Report</button>

        <button class="btn btn-primary btn-sm" onclick="openEditClient(${c.id})">Edit Client</button>

    <div class="cd-stats">
      <div class="cd-stat"><div class="cd-stat-lbl">Revenue</div><div class="cd-stat-val" style="color:var(--orange)">${fmt(c.revenue)}</div></div>
      <div class="cd-stat"><div class="cd-stat-lbl">Ad Spend</div><div class="cd-stat-val">${fmt(c.spend)}</div></div>
      <div class="cd-stat"><div class="cd-stat-lbl">Profit</div><div class="cd-stat-val" style="color:var(--green)">${fmt(c.profit)}</div></div>
      <div class="cd-stat"><div class="cd-stat-lbl">Expected</div><div class="cd-stat-val" style="color:var(--blue)">${fmt(c.expected_revenue)}</div></div>
      <div class="cd-stat"><div class="cd-stat-lbl">ROI</div><div class="cd-stat-val" style="color:var(--green)">${c.spend>0?((c.profit/c.spend)*100).toFixed(0):'—'}${c.spend>0?'%':''}</div></div>

  const filesHtml=`
  <div class="cd-card">
    <div class="cd-card-head">
      <div class="cd-card-title">Client Files</div>
      <button class="btn btn-primary btn-sm" onclick="openUploadFile(${c.id})">+ Upload File</button>

  const campHtml=`

    <table><thead><tr><th>Campaign</th><th>Channel</th><th>Budget</th><th>Spend</th><th>Progress</th><th>Status</th></tr></thead><tbody>
    ${c.campaigns.map(camp=>{const p=camp.budget>0?Math.round(camp.spend/camp.budget*100):0;return`<tr>
      <td style="font-weight:500">${camp.name}</td>
      <td><span class="badge badge-blue">${camp.channel}</span></td>

      <td><div class="progress-wrap"><div class="progress-bar-bg"><div class="progress-bar" style="width:${Math.min(p,100)}%;background:${p>90?'var(--red)':p>70?'var(--orange)':'var(--green)'}"></div></div><span style="font-size:11px;color:var(--muted);min-width:28px">${p}%</span></div></td>

    <table><thead><tr><th>Quote #</th><th>Items</th><th>Subtotal</th><th>GST</th><th>Total</th><th>Valid Until</th><th></th></tr></thead><tbody>
    ${c.quotations.map(q=>`<tr>

      <td style="white-space:nowrap">
        <button class="btn btn-ghost btn-sm" onclick='viewQuotation(${q.id},${JSON.stringify(c.name).replace(/'/g,"&#39;")},${JSON.stringify(c.company).replace(/'/g,"&#39;")})'>View/Print</button>
        <button class="btn btn-ghost btn-sm" style="color:var(--red)" onclick="deleteQuotation(${c.id},${q.id})">Delete</button>

    </tr>`).join('')}

  </div>`;

  return `
  <div class="back-btn" onclick="navigate('clients')">← Back to Clients</div>
  ${headerHtml}

  <div class="calendar" id="calendar-${c.id}">${renderCalendar(c)}</div>`;

// ── META SECTION (in client detail) ───────────────────────────
function buildMetaSection(c){
  const meta=c.metaAccount,m=c.metaMetrics;
  if(meta&&meta.is_active){
    const balance=(meta.balance!==null&&meta.balance!==undefined)?meta.balance:null;
    const balanceLow=balance!==null&&balance<500;
    const balanceCritical=balance!==null&&balance<100;
    const lowBanner=balanceLow?`<div class="low-budget-banner" style="background:${balanceCritical?'#FEF2F2':'#FFFBEB'};border-color:${balanceCritical?'#FECACA':'#FDE68A'}">
      <span style="font-size:22px;flex-shrink:0">${balanceCritical?'🚨':'⚠️'}</span>
      <div style="flex:1"><div style="font-size:13px;font-weight:700;color:${balanceCritical?'#991B1B':'#92400E'};margin-bottom:2px">${balanceCritical?'Critical — Ad account almost out of funds!':'Low Funds — Top up this account soon'}</div>
      <div style="font-size:12px;color:${balanceCritical?'#B91C1C':'#B45309'}">Only <strong>₹${balance.toLocaleString('en-IN',{minimumFractionDigits:0,maximumFractionDigits:0})}</strong> left in this Meta Ads account.</div></div>
    </div>`:'';
    const metricsGrid=m?`<div class="meta-metrics">
      <div class="meta-metric"><div class="meta-metric-label">Funds Remaining</div><div class="meta-metric-value" style="color:${balance===null?'var(--muted)':balanceCritical?'var(--red)':balanceLow?'#D97706':'var(--green)'}">${balance!==null?'₹'+balance.toLocaleString('en-IN',{minimumFractionDigits:0,maximumFractionDigits:0}):'—'}</div></div>
      <div class="meta-metric"><div class="meta-metric-label">Spend (30d)</div><div class="meta-metric-value orange">₹${(m.spend||0).toLocaleString('en-IN',{minimumFractionDigits:0,maximumFractionDigits:0})}</div></div>
      <div class="meta-metric"><div class="meta-metric-label">Impressions</div><div class="meta-metric-value">${(m.impressions||0).toLocaleString()}</div></div>
      <div class="meta-metric"><div class="meta-metric-label">Clicks</div><div class="meta-metric-value">${(m.clicks||0).toLocaleString()}</div></div>
      <div class="meta-metric"><div class="meta-metric-label">CTR</div><div class="meta-metric-value ${(m.ctr||0)<1?'':'green'}" style="${(m.ctr||0)<1?'color:var(--red)':''}">${(m.ctr||0).toFixed(2)}%</div></div>
      <div class="meta-metric"><div class="meta-metric-label">CPC</div><div class="meta-metric-value">₹${(m.cpc||0).toFixed(2)}</div></div>
      <div class="meta-metric"><div class="meta-metric-label">Reach</div><div class="meta-metric-value">${(m.reach||0).toLocaleString()}</div></div>
      <div class="meta-metric"><div class="meta-metric-label">Leads</div><div class="meta-metric-value green">${(m.leads||0).toLocaleString()}</div></div>
    </div>`:
    `<div class="empty-state" style="padding:20px"><div class="empty-text">No spend data yet. Click "Sync Now" to pull metrics from Meta.</div></div>`;
    return `<div class="cd-card">
      <div class="cd-card-head">
        <div style="display:flex;align-items:center;gap:8px">
          <div class="cd-card-title">Meta Ads</div>
          <span class="badge badge-green" style="font-size:10px">Connected</span>
          ${balanceLow?`<span style="font-size:10px;font-weight:700;background:${balanceCritical?'#FEE2E2':'#FEF9C3'};color:${balanceCritical?'#991B1B':'#854D0E'};border-radius:20px;padding:2px 8px">${balanceCritical?'🚨 Critical':'⚠️ Low Funds'}</span>`:''}
        </div>
        <div style="display:flex;gap:6px;align-items:center">
          ${meta?.last_synced?`<span style="font-size:11px;color:var(--muted)">Synced ${relTime(meta.last_synced)}</span>`:''}
          <button class="btn btn-sm" id="meta-sync-btn" onclick="syncClientMeta(${c.id})">↻ Sync Now</button>
          <button class="btn btn-ghost btn-sm" onclick="showMetaEditForm(${c.id})">Edit</button>
          <button class="btn btn-ghost btn-sm" style="color:var(--red)" onclick="disconnectMeta(${c.id})">Disconnect</button>
        </div>
      </div>
      ${lowBanner}
      <div style="padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px">
        <span style="font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px">Account ID</span>
        <code style="font-size:11px;background:#F3F4F6;border:1px solid var(--border);border-radius:5px;padding:2px 7px">${meta.ad_account_id}</code>
      </div>
      ${metricsGrid}
      <div id="meta-edit-form" style="display:none;padding:20px;border-top:1px solid var(--border);background:#FAFAFA">
        <div class="form-row">
          <div class="form-group"><label class="form-label">Ad Account ID</label><input class="form-input" id="meta-edit-acc" value="${meta?meta.ad_account_id:''}"></div>
          <div class="form-group"><label class="form-label">Access Token <span style="color:var(--subtle);font-size:10px">(blank = keep existing)</span></label><input class="form-input" id="meta-edit-token" type="password" placeholder="EAAx..."></div>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-primary btn-sm" onclick="saveMetaAccount(${c.id},true)">Save Changes</button>
          <button class="btn btn-ghost btn-sm" onclick="document.getElementById('meta-edit-form').style.display='none'">Cancel</button>
        </div>
      </div>
    </div>`;
  }
  return `<div class="cd-card">
    <div class="cd-card-head">
      <div style="display:flex;align-items:center;gap:8px">
        <div class="cd-card-title">Meta Ads</div>
        <span class="badge badge-gray" style="font-size:10px">Not Connected</span>
      </div>
    </div>
    <div style="padding:20px">
      <div style="font-size:13px;color:var(--muted);margin-bottom:16px">Connect this client's Meta Ads account to automatically pull performance metrics and live balance daily.</div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Ad Account ID</label><input class="form-input" id="meta-account-id" placeholder="act_XXXXXXXXXX"></div>
        <div class="form-group"><label class="form-label">Access Token</label><input class="form-input" id="meta-token" type="password" placeholder="EAAx..."></div>
      </div>
      <button class="btn btn-primary btn-sm" id="meta-save-btn" onclick="saveMetaAccount(${c.id},false)">Save &amp; Connect</button>
    </div>
  </div>`;
}

// ── CONTENT CALENDAR ──────────────────────────────────────────
function renderCalendar(client){
  if(!appState.calendarMonth){const d=new Date();appState.calendarMonth={year:d.getFullYear(),month:d.getMonth()};}
  const{year,month}=appState.calendarMonth;
  const monthNames=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const first=new Date(year,month,1);
  const lastDay=new Date(year,month+1,0).getDate();
  const startWeekday=first.getDay();
  const today=new Date();
  const tasks=client.contentTasks||[];
  const tasksByDay={};
  tasks.forEach(t=>{const td=new Date(t.date);if(td.getFullYear()===year&&td.getMonth()===month){const k=td.getDate();if(!tasksByDay[k])tasksByDay[k]=[];tasksByDay[k].push(t);}});
  let cells='';
  for(let i=0;i<startWeekday;i++) cells+=`<div class="cal-day empty"></div>`;
  for(let d=1;d<=lastDay;d++){
    const dayTasks=tasksByDay[d]||[];
    const dateStr=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday=today.getFullYear()===year&&today.getMonth()===month&&today.getDate()===d;
    const dots=dayTasks.slice(0,6).map(t=>`<span class="cal-task-dot" style="background:${platformColor(t.platform)}" title="${t.platform} · ${t.content_type}"></span>`).join('');
    cells+=`<div class="cal-day ${isToday?'today':''}" onclick="openAddContentTask(${client.id},'${dateStr}')"><div class="cal-day-num">${d}</div><div class="cal-day-tasks">${dots}</div></div>`;
  }
  const dayNames=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(n=>`<div class="cal-day-name">${n}</div>`).join('');
  const taskList=tasks.length===0?'':`<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--border)">
    <div style="font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:10px">Scheduled this month</div>
    ${tasks.filter(t=>{const td=new Date(t.date);return td.getFullYear()===year&&td.getMonth()===month;}).map(t=>`
    <div style="display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13px;border-bottom:1px solid #F5F5F5">
      <span class="cal-task-dot" style="background:${platformColor(t.platform)};width:9px;height:9px"></span>
      <span style="font-weight:500;min-width:90px">${new Date(t.date).toLocaleDateString('en-IN',{day:'numeric',month:'short'})}</span>
      <span style="color:var(--muted)">${t.platform} · ${t.content_type}</span>
      ${t.notes?`<span style="color:var(--subtle);font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">— ${t.notes}</span>`:'<span style="flex:1"></span>'}
      <button class="btn btn-ghost btn-sm" style="color:var(--red)" onclick="deleteContentTask(${client.id},${t.id})">×</button>
    </div>`).join('')}
  </div>`;
  return `<div class="cal-head"><div class="cal-title">Content Calendar — ${monthNames[month]} ${year}</div>
    <div class="cal-nav">
      <button class="cal-nav-btn" onclick="changeMonth(-1)">‹</button>
      <button class="cal-nav-btn" onclick="changeMonth(0)">●</button>
      <button class="cal-nav-btn" onclick="changeMonth(1)">›</button>
    </div>
  </div>
  <div class="cal-grid">${dayNames}${cells}</div>
  ${taskList}`;
}
async function changeMonth(delta){
  if(delta===0){const d=new Date();appState.calendarMonth={year:d.getFullYear(),month:d.getMonth()};}
  else{const m=appState.calendarMonth.month+delta;appState.calendarMonth={year:appState.calendarMonth.year+Math.floor(m/12),month:((m%12)+12)%12};}
  navigate('clientDetail',appState.selectedClientId);
}
function openAddContentTask(clientId,dateStr){
  openModal(`<div class="modal-title">Add Content Task — ${new Date(dateStr).toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'})}</div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Platform</label><select class="form-input" id="m-plat"><option>Instagram</option><option>Meta</option><option>LinkedIn</option><option>YouTube</option><option>Google</option></select></div>
      <div class="form-group"><label class="form-label">Content Type</label><select class="form-input" id="m-ctype"><option>Reel</option><option>Post</option><option>Story</option><option>Ad</option><option>Video</option></select></div>
    </div>
    <div class="form-group"><label class="form-label">Notes</label><textarea class="form-input" id="m-notes" rows="3" placeholder="Caption ideas, links, briefing…"></textarea></div>
    <input type="hidden" id="m-date" value="${dateStr}">
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveContentTask(${clientId})">Add Task</button></div>`);
}
async function saveContentTask(clientId){
  await api(`/api/clients/${clientId}/content-tasks`,{method:'POST',body:JSON.stringify({date:document.getElementById('m-date').value,platform:document.getElementById('m-plat').value,content_type:document.getElementById('m-ctype').value,notes:document.getElementById('m-notes').value})});
  toast('Task added');closeModal();navigate('clientDetail',clientId);
}
async function deleteContentTask(clientId,id){
  if(!confirm('Delete this task?')) return;
  await api(`/api/clients/${clientId}/content-tasks/${id}`,{method:'DELETE'});
  toast('Task removed');navigate('clientDetail',clientId);
}

// ── QUOTATIONS ────────────────────────────────────────────────
function openCreateQuotation(clientId,clientName,clientCompany){
  appState.quoteItems=[{service:'',description:'',qty:1,rate:0}];
  const validDate=new Date();validDate.setDate(validDate.getDate()+30);
  openModal(`<div class="modal-title">Create Quotation — ${clientName}</div>
    <div id="quote-items-wrap"></div>
    <button class="btn btn-sm" style="margin:6px 0 14px" onclick="addQuoteItem()">+ Add Line Item</button>
    <div class="form-row">
      <div class="form-group"><label class="form-label">GST %</label><input class="form-input" id="m-gst" type="number" value="18" oninput="renderQuoteItems()"></div>
      <div class="form-group"><label class="form-label">Valid Until</label><input class="form-input" id="m-valid" type="date" value="${validDate.toISOString().split('T')[0]}"></div>
    </div>
    <div class="form-group"><label class="form-label">Notes / Terms</label><textarea class="form-input" id="m-notes" rows="2" placeholder="Payment terms, scope, exclusions…"></textarea></div>
    <div id="quote-totals-wrap"></div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveQuotation(${clientId})">Save Quotation</button></div>`);
  document.querySelector('.modal').classList.add('modal-lg');
  renderQuoteItems();
}
function addQuoteItem(){appState.quoteItems.push({service:'',description:'',qty:1,rate:0});renderQuoteItems();}
function removeQuoteItem(i){appState.quoteItems.splice(i,1);if(appState.quoteItems.length===0)appState.quoteItems.push({service:'',description:'',qty:1,rate:0});renderQuoteItems();}
function updateQuoteItem(i,field,val){appState.quoteItems[i][field]=val;renderQuoteTotals();}
function renderQuoteItems(){
  const wrap=document.getElementById('quote-items-wrap');if(!wrap) return;
  wrap.innerHTML=`<table class="quote-table"><thead><tr><th style="width:24%">Service</th><th>Description</th><th style="width:70px">Qty</th><th style="width:110px">Rate (₹)</th><th style="width:110px">Amount</th><th style="width:36px"></th></tr></thead>
    <tbody>${appState.quoteItems.map((it,i)=>`<tr>
      <td><input value="${it.service||''}" placeholder="Service name" oninput="updateQuoteItem(${i},'service',this.value)"></td>
      <td><input value="${it.description||''}" placeholder="Brief description" oninput="updateQuoteItem(${i},'description',this.value)"></td>
      <td><input type="number" value="${it.qty}" min="0" oninput="updateQuoteItem(${i},'qty',parseFloat(this.value)||0)"></td>
      <td><input type="number" value="${it.rate}" min="0" oninput="updateQuoteItem(${i},'rate',parseFloat(this.value)||0)"></td>
      <td style="font-weight:500">${fmt((it.qty||0)*(it.rate||0))}</td>
      <td><button class="btn btn-ghost btn-sm" style="color:var(--red)" onclick="removeQuoteItem(${i})">×</button></td>
    </tr>`).join('')}</tbody></table>`;
  renderQuoteTotals();
}
function renderQuoteTotals(){
  const wrap=document.getElementById('quote-totals-wrap');if(!wrap) return;
  const subtotal=appState.quoteItems.reduce((s,i)=>s+(i.qty||0)*(i.rate||0),0);
  const gstPct=parseFloat(document.getElementById('m-gst')?.value)||0;
  const gstAmt=subtotal*gstPct/100;
  const total=subtotal+gstAmt;
  wrap.innerHTML=`<div class="quote-totals">
    <div class="quote-totals-row"><span style="color:var(--muted)">Subtotal</span><span>${fmt(subtotal)}</span></div>
    <div class="quote-totals-row"><span style="color:var(--muted)">GST (${gstPct}%)</span><span>${fmt(gstAmt)}</span></div>

async function saveQuotation(clientId){

  if(items.length===0){toast('Add at least one valid line item','error');return;}
  await api(`/api/clients/${clientId}/quotations`,{method:'POST',body:JSON.stringify({items,gst_pct:parseFloat(document.getElementById('m-gst').value)||0,valid_until:document.getElementById('m-valid').value,notes:document.getElementById('m-notes').value})});

async function deleteQuotation(clientId,id){

}

function buildCreativesTab(creatives){
  if(!creatives||creatives.length===0){
    return `<div class="empty-state"><div class="empty-icon">🎨</div><div class="empty-text">No creative data yet. Sync Meta accounts to pull creative performance data.<br><br><button class="btn btn-primary btn-sm" onclick="syncMeta()">↻ Sync Meta Now</button></div></div>`;
  }
  // Sort by CTR descending = best performing first
  const sorted=[...creatives].sort((a,b)=>(b.ctr||0)-(a.ctr||0));
  return `
  <div class="chart-card">
    <div class="chart-header">
      <div class="chart-title">Creative Performance Rankings</div>
      <span style="font-size:12px;color:var(--muted)">Ranked by CTR — higher = better</span>
    </div>
    <table><thead><tr><th>#</th><th>Creative</th><th>Type</th><th>Impressions</th><th>Clicks</th><th>CTR</th><th>Spend</th><th>Leads</th><th>Why it performs</th></tr></thead><tbody>
    ${sorted.map((cr,i)=>`<tr>
      <td><span style="font-size:13px;font-weight:700;color:${i===0?'#F59E0B':i===1?'#9CA3AF':i===2?'#CD7C2F':'var(--muted)'}">${i===0?'🥇':i===1?'🥈':i===2?'🥉':'#'+(i+1)}</span></td>
      <td style="font-weight:500;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${cr.name||cr.creative_id}">${cr.name||cr.creative_id||'Creative '+(i+1)}</td>
      <td><span class="badge badge-blue">${cr.type||'Image'}</span></td>
      <td>${(cr.impressions||0).toLocaleString()}</td>
      <td>${(cr.clicks||0).toLocaleString()}</td>
      <td style="font-weight:600;color:${(cr.ctr||0)>=2?'var(--green)':(cr.ctr||0)>=1?'var(--orange)':'var(--red)'}">${(cr.ctr||0).toFixed(2)}%</td>
      <td>${fmt(cr.spend||0)}</td>
      <td style="color:var(--green)">${(cr.leads||0).toLocaleString()}</td>
      <td style="font-size:12px;color:var(--muted);max-width:200px">${creativeInsight(cr,i)}</td>
    </tr>`).join('')}
    </tbody></table>
  </div>
  <div class="chart-card">
    <div class="chart-title" style="margin-bottom:12px">📊 Improvement Suggestions</div>
    ${sorted.slice(-3).reverse().map((cr,i)=>`<div style="display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #F5F5F5">
      <span style="font-size:16px;flex-shrink:0">💡</span>
      <div>
        <div style="font-size:13px;font-weight:500;margin-bottom:3px">${cr.name||cr.creative_id||'Creative'}</div>
        <div style="font-size:12px;color:var(--muted)">${improvementSuggestion(cr)}</div>
      </div>
    </div>`).join('')}
  </div>`;
}
function creativeInsight(cr,rank){
  if(rank===0) return 'Top performer — highest CTR, strong hook or visual';
  if((cr.ctr||0)>=2) return 'Strong CTR — resonating well with audience';
  if((cr.ctr||0)>=1) return 'Average performance — test stronger CTA or image';
  return 'Low CTR — consider refreshing visual or headline';
}
function improvementSuggestion(cr){
  if((cr.ctr||0)<0.5) return `CTR is ${(cr.ctr||0).toFixed(2)}% — very low. Replace with a stronger hook image or video. Test a new headline. Audience may have seen this too many times (ad fatigue).`;
  if((cr.leads||0)===0&&(cr.clicks||0)>50) return 'Getting clicks but zero leads. Landing page may not match the ad promise. Check the destination URL and CTA.';
  if((cr.spend||0)>50000&&(cr.leads||0)<5) return 'High spend with very few leads. Pause this creative and reallocate budget to top performers.';
  return 'Moderate performer. A/B test with a video version of the same concept for potential 2x improvement.';
}

async function generateAIResearch(clientName, clientCompany){
  const industry = document.getElementById('ai-industry')?.value || '';
  const desc = document.getElementById('ai-desc')?.value || '';
  const focus = document.getElementById('ai-focus')?.value || 'full';
  if(!industry){toast('Enter industry/niche first','error');return;}

  const focusLabels = {full:'Full Market Analysis',audience:'Target Audience Analysis',competitor:'Competitor Analysis',adcopy:'Ad Copy Angles & Hooks',funnel:'Marketing Funnel Strategy'};
  
  const btn = document.querySelector('#ai-research-result')?.previousElementSibling?.querySelector('button.btn-primary');
  if(btn){btn.disabled=true;btn.textContent='🤖 Generating...';}
  
  const prompt = `You are a senior digital marketing strategist. Generate a detailed ${focusLabels[focus]} report for this client:

Client: ${clientName}
Company: ${clientCompany}
Industry/Niche: ${industry}
${desc?'Description: '+desc:''}

Provide a structured, actionable report covering:
${focus==='full'?`1. Market Overview & Size
2. Target Audience (demographics, psychographics, pain points)
3. Key Competitors (3-5) and their positioning
4. Recommended Ad Channels (Meta, Google, etc.) with rationale
5. Top 5 Ad Copy Angles/Hooks
6. Recommended Marketing Funnel
7. KPIs to Track
8. Quick Wins (actions to take this week)`:
focus==='audience'?`1. Primary Target Audience Profile (age, gender, location, income)
2. Psychographic Profile (values, interests, lifestyle)
3. Top 5 Pain Points
4. Customer Journey Map
5. Best Platforms to Reach Them
6. Messaging that Resonates`:
focus==='competitor'?`1. Top 5 Competitors in ${industry}
2. Their Strengths and Weaknesses
3. Their Ad Strategies (what angles they use)
4. Market Gaps You Can Exploit
5. Your Unique Positioning`:
focus==='adcopy'?`1. 10 High-Converting Ad Headlines
2. 5 Primary Text Variations
3. 3 Call-to-Action Options
4. Emotional vs Rational Hooks
5. Pain Point vs Desire-Based Angles
6. Best Ad Formats for This Business`:
`1. Awareness Stage Strategy
2. Consideration Stage Strategy  
3. Conversion Stage Strategy
4. Retargeting Strategy
5. Upsell/Retention Strategy
6. Budget Allocation Recommendation`}

Format with clear headers and bullet points. Be specific and actionable.`;

  const resultDiv = document.getElementById('ai-research-result');
  const contentDiv = document.getElementById('ai-research-content');
  if(resultDiv) resultDiv.style.display='block';
  if(contentDiv) contentDiv.textContent='Generating your report...';

  try{
    const res = await fetch('/api/ai/research', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({prompt, clientName, clientCompany, industry, focus})
    });
    const data = await res.json();
    if(data.report){
      if(contentDiv) contentDiv.textContent = data.report;
    } else {
      if(contentDiv) contentDiv.textContent = data.error || 'Failed to generate report';
    }
  }catch(e){
    if(contentDiv) contentDiv.textContent = 'Error: '+e.message;
  }finally{
    if(btn){btn.disabled=false;btn.textContent='🤖 Generate Research Report';}
  }
}

function copyResearch(){
  const content = document.getElementById('ai-research-content')?.textContent||'';
  navigator.clipboard.writeText(content).then(()=>toast('Report copied to clipboard'));
}

async function buildTally(){
  let entries=[];
  try{
    const raw=await api('/api/finance/daily-spend');
    // server returns plain array
    entries=Array.isArray(raw)?raw:(raw.entries||[]);
  }catch(e){}
  // Build summary from entries
  const catMap={};
  entries.forEach(e=>{const k=e.category||'Other';if(!catMap[k])catMap[k]=0;catMap[k]+=(e.amount||0);});
  const summary={total:entries.reduce((s,e)=>s+(e.amount||0),0),categories:Object.entries(catMap).map(([name,total])=>({name,total}))};

  // Group by month
  const byMonth={};
  entries.forEach(e=>{
    const m=e.date?e.date.slice(0,7):'unknown';
    if(!byMonth[m]){byMonth[m]={total:0,entries:[]};}
    byMonth[m].total+=e.amount||0;
    byMonth[m].entries.push(e);
  });
  const months=Object.keys(byMonth).sort().reverse();

  const categoryColors={'Ad Spend':'#FF6A00','Salary':'#3B82F6','Software':'#8B5CF6','Office':'#10B981','Travel':'#F59E0B','Other':'#9CA3AF'};

  return `
  <div class="stats-grid" style="grid-template-columns:repeat(4,1fr)">
    <div class="stat-card accent"><div class="stat-label">Total Spends</div><div class="stat-value">${fmt(summary.total||0)}</div></div>
    <div class="stat-card"><div class="stat-label">This Month</div><div class="stat-value">${fmt(byMonth[new Date().toISOString().slice(0,7)]?.total||0)}</div></div>
    <div class="stat-card green-accent"><div class="stat-label">Categories</div><div class="stat-value">${(summary.categories||[]).length}</div></div>

async function buildReminders(){
  let reminders=[];
  try{reminders=await api('/api/reminders');}catch(e){}
  const now=new Date();
  const overdue=reminders.filter(r=>r.status==='pending'&&new Date(r.due_date)<now);
  const upcoming=reminders.filter(r=>r.status==='pending'&&new Date(r.due_date)>=now);
  const sent=reminders.filter(r=>r.status==='sent');

  return `
  ${overdue.length?`<div style="background:#FEF2F2;border:1px solid #FECACA;border-radius:10px;padding:14px 18px;margin-bottom:16px">
    <div style="font-size:12px;font-weight:700;color:#991B1B;margin-bottom:8px">🚨 Overdue Reminders (${overdue.length})</div>
    ${overdue.map(r=>`<div style="display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid #FECACA">
      <div style="flex:1"><span style="font-weight:500">${r.client_name||'—'}</span> — ${r.title} <span style="color:#991B1B;font-size:11px">(due ${new Date(r.due_date).toLocaleDateString('en-IN')})</span></div>
      <button class="btn btn-sm" style="background:#991B1B;color:#fff;border-color:#991B1B" onclick="sendReminder(${r.id})">📧 Send Now</button>
      <button class="btn btn-ghost btn-sm" onclick="markReminderSent(${r.id})">Mark Sent</button>
    </div>`).join('')}
  </div>`:''}

  <div class="table-wrap">
    <div class="table-header">
      <div class="table-title">Upcoming Reminders</div>
    </div>
    ${upcoming.length===0?`<div class="empty-state" style="padding:32px 20px"><div class="empty-text">No upcoming reminders. Add one using the button above.</div></div>`:`
    <table><thead><tr><th>Client</th><th>Title</th><th>Amount</th><th>Due Date</th><th>Channel</th><th>Status</th><th></th></tr></thead><tbody>
    ${upcoming.map(r=>`<tr>
      <td style="font-weight:500">${r.client_name||'—'}</td>
      <td>${r.title}</td>
      <td style="font-weight:600;color:var(--orange)">${r.amount?fmt(r.amount):'—'}</td>
      <td style="color:var(--muted)">${new Date(r.due_date).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}</td>
      <td><div style="display:flex;gap:4px">${(r.channels||['email']).map(ch=>`<span class="badge ${ch==='whatsapp'?'badge-green':ch==='email'?'badge-blue':'badge-gray'}">${ch==='whatsapp'?'📱':'📧'} ${ch}</span>`).join('')}</div></td>
      <td><span class="badge badge-orange">Pending</span></td>
      <td style="white-space:nowrap">
        <button class="btn btn-primary btn-sm" onclick="sendReminder(${r.id})">Send Now</button>
        <button class="btn btn-ghost btn-sm" onclick="markReminderSent(${r.id})">Mark Sent</button>
        <button class="btn btn-ghost btn-sm" style="color:var(--red)" onclick="deleteReminder(${r.id})">Delete</button>
      </td>
    </tr>`).join('')}
    </tbody></table>`}
  </div>

  <div class="table-wrap">
    <div class="table-header"><div class="table-title">Sent Reminders</div></div>
    ${sent.length===0?`<div class="empty-state" style="padding:24px 20px"><div class="empty-text">No reminders sent yet.</div></div>`:`
    <table><thead><tr><th>Client</th><th>Title</th><th>Amount</th><th>Sent At</th><th>Channel</th></tr></thead><tbody>
    ${sent.map(r=>`<tr>
      <td style="font-weight:500">${r.client_name||'—'}</td>
      <td>${r.title}</td>
      <td>${r.amount?fmt(r.amount):'—'}</td>
      <td style="color:var(--muted)">${r.sent_at?new Date(r.sent_at).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'—'}</td>
      <td><span class="badge badge-green">✓ Sent</span></td>
    </tr>`).join('')}
    </tbody></table>`}
  </div>`;
}

async function buildSettings(){
  if(!appState.settingsTab) appState.settingsTab='company';
